[project]
name = "market-data"
version = "0.1.0"
description = "Market-data IO (safe CSV import, Parquet) for STDevsec Trading Lab."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "quant-engine",
    "pandas>=2.2",
    "pyarrow>=16",
]

[tool.uv.sources]
quant-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]
