[project]
name = "stdevsec-api"
version = "0.1.0"
description = "STDevsec Trading Lab REST API (FastAPI)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "quant-engine",
    "market-data",
]

[tool.uv.sources]
quant-engine = { workspace = true }
market-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stdevsec_api"]
